<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>POS — {{site.name}}</title>
  <meta name="theme-color" content="#0f2017">
  <link rel="icon" href="/media/icon-32.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/pos.css">
  <link rel="stylesheet" href="/css/docs.css" media="print">
</head>
<body class="pos-body">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="a-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="a-minus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5 12h14"/></symbol>
    <symbol id="a-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="a-search" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></symbol>
    <symbol id="a-key" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14.5 9.5a4.5 4.5 0 1 1-1.3-3.2 4.5 4.5 0 0 1 1.3 3.2zM13.2 12.7 21 20.5M17.5 17l2-2M15.5 15l1.5-1.5"/></symbol>
    <symbol id="a-bill" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="a-move" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 8h13m-4-4 4 4-4 4M20 16H7m4-4-4 4 4 4"/></symbol>
    <symbol id="a-cash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 7h18v10H3zM12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM6 10v4M18 10v4"/></symbol>
    <symbol id="a-clock" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2"/></symbol>
    <symbol id="a-user" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="a-print" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></symbol>
    <symbol id="a-mail" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5zM3.5 6l8.5 7 8.5-7"/></symbol>
    <symbol id="a-ext" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="a-out" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="a-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></symbol>
    <symbol id="a-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m5 12 5 5 9-10"/></symbol>
    <symbol id="a-doc" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></symbol>
    <symbol id="a-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1.1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></symbol>
    <symbol id="a-tag" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9zM7.5 8.5h.01"/></symbol>
  </svg>

  <!-- sign in -->
  <div class="login" data-login hidden>
    <form class="login__card" data-login-form>
      <img src="/media/logo.png" alt="{{site.name}}" width="200">
      <h1>POS sign in</h1>
      <p>Use your admin username and password.</p>
      <label class="fld"><span>Username</span><input name="username" autocomplete="username" required></label>
      <label class="fld"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="login__err" data-login-err hidden></p>
      <button class="abtn abtn--primary abtn--block" type="submit">Sign in</button>
      <a class="login__back" href="/admin/">← Admin panel</a>
      <p class="login__credit">{{site.poweredBy}}</p>
    </form>
  </div>

  <!-- the POS -->
  <div class="pos" data-app hidden>
    <header class="pos-top">
      <a class="pos-top__brand" href="/pos"><img src="/media/logo-light.png" alt="{{site.name}}"><span>POS</span></a>
      <span class="pos-top__date" data-date></span>
      <span class="pos-top__gap"></span>
      <button class="abtn abtn--amber pos-top__in" type="button" data-checkin><svg width="18" height="18"><use href="#a-key"/></svg><span>Check in</span><b class="pos-badge" data-arrivals hidden></b></button>
      <button class="abtn pos-top__link" type="button" data-walkin title="A guest without a booking"><svg width="17" height="17"><use href="#a-plus"/></svg><span>Walk-in</span></button>
      <a class="abtn pos-top__link" href="/admin/#/bills" target="ydadmin"><svg width="17" height="17"><use href="#a-bill"/></svg><span>Bills</span></a>
      <a class="abtn pos-top__link" href="/admin/" target="ydadmin" data-admin-link><svg width="17" height="17"><use href="#a-ext"/></svg><span>Admin</span></a>
      <button class="abtn abtn--ghost pos-top__out" type="button" data-logout title="Sign out"><svg width="18" height="18"><use href="#a-out"/></svg><span data-user></span></button>
    </header>
    <main class="pos-main">
      <section class="pos-menu" aria-label="Menu">
        <div class="pos-menu__bar">
          <div class="pos-tabs" role="tablist" aria-label="Categories" data-tabs></div>
          <label class="pos-find"><svg width="17" height="17"><use href="#a-search"/></svg><input class="inp" type="search" placeholder="Find an item" aria-label="Find an item" data-item-q></label>
        </div>
        <div class="pos-tiles" data-tiles></div>
        <div class="pos-menu__foot"><button class="abtn" type="button" data-custom><svg width="16" height="16"><use href="#a-plus"/></svg>Custom item</button><span data-hint>Tap an item to add one to the bill.</span></div>
      </section>
      <section class="pos-bill" aria-label="The guest's bill" data-bill></section>
      <aside class="pos-guests" aria-label="Checked-in guests">
        <div class="pos-guests__head">
          <h2>Checked in <span data-guest-count></span></h2>
          <button class="abtn abtn--ghost abtn--sm pos-sheet-close" type="button" data-sheet-close aria-label="Close"><svg width="18" height="18"><use href="#a-x"/></svg></button>
          <label class="pos-find"><svg width="17" height="17"><use href="#a-search"/></svg><input class="inp" type="search" placeholder="Name, room or ref" aria-label="Find a guest" data-guest-q></label>
        </div>
        <div class="pos-guests__list" data-guests></div>
      </aside>
    </main>
    <!-- phones: who is selected and their total, opening the guest list or the bill -->
    <nav class="pos-dock" aria-label="Guest and bill">
      <button type="button" class="pos-dock__guest" data-open-guests><svg width="18" height="18"><use href="#a-user"/></svg><span data-dock-guest>Choose a guest</span></button>
      <button type="button" class="pos-dock__bill" data-open-bill><span>Bill</span><b data-dock-total></b></button>
    </nav>
    <div class="pos-scrim" data-sheet-close></div>
  </div>

  <!-- dialogs -->
  <div class="drawer drawer--center" data-modal aria-hidden="true">
    <div class="drawer__scrim" data-modal-close></div>
    <section class="drawer__panel modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" data-modal-panel></section>
  </div>

  <div class="toasts" data-toasts aria-live="polite"></div>

  {{boot}}
  <script src="/js/pdf.js"></script>
  <script src="/js/staff.js"></script>
  <script src="/js/pos.js"></script>
</body>
</html>
