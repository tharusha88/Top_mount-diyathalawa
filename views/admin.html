<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — {{site.name}}</title>
  <meta name="theme-color" content="#0f2017">
  <link rel="icon" href="/media/icon-32.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/docs.css" media="print">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="a-home" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="a-cal" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 10h16M8 3v4M16 3v4"/></symbol>
    <symbol id="a-list" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="a-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="a-bed" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M3 19v-9m0 5h18v4m0-4v-2.5A2.5 2.5 0 0 0 18.5 10H11v5M7 13a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></symbol>
    <symbol id="a-cog" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="a-out" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="a-ext" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="a-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></symbol>
    <symbol id="a-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></symbol>
    <symbol id="a-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="a-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></symbol>
    <symbol id="a-mail" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5zM3.5 6l8.5 7 8.5-7"/></symbol>
    <symbol id="a-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1.1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></symbol>
    <symbol id="a-dl" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></symbol>
    <symbol id="a-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 20V9m-5 5 5-5 5 5M5 4h14"/></symbol>
    <symbol id="a-search" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></symbol>
    <symbol id="a-menu" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="a-pos" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M5 8h14l-1.1 11.1a2 2 0 0 1-2 1.9H8.1a2 2 0 0 1-2-1.9zM9 8V6a3 3 0 0 1 6 0v2"/></symbol>
    <symbol id="a-bill" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="a-move" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 8h13m-4-4 4 4-4 4M20 16H7m4-4-4 4 4 4"/></symbol>
    <symbol id="a-chevup" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m6 15 6-6 6 6"/></symbol>
    <symbol id="a-chevdown" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></symbol>
    <symbol id="a-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m5 12 5 5 9-10"/></symbol>
    <symbol id="a-sliders" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2.4" fill="currentColor"/><circle cx="16" cy="12" r="2.4" fill="currentColor"/><circle cx="7" cy="18" r="2.4" fill="currentColor"/></symbol>
    <symbol id="a-print" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></symbol>
    <symbol id="a-tag" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9zM7.5 8.5h.01"/></symbol>
    <symbol id="a-doc" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></symbol>
    <symbol id="a-chart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></symbol>
    <symbol id="a-user" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></symbol>
  </svg>

  <!-- LOGIN -->
  <div class="login" data-login hidden>
    <form class="login__card" data-login-form>
      <img src="/media/logo.png" alt="{{site.name}}" width="200">
      <h1>Admin sign in</h1>
      <p>Manage bookings for {{site.name}}.</p>
      <label class="fld"><span>Username</span><input name="username" autocomplete="username" required></label>
      <label class="fld"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="login__err" data-login-err hidden></p>
      <button class="abtn abtn--primary abtn--block" type="submit">Sign in</button>
      <a class="login__back" href="/">← Back to the website</a>
      <p class="login__credit">{{site.poweredBy}}</p>
    </form>
  </div>

  <!-- APP -->
  <div class="app" data-app hidden>
    <aside class="side" data-side>
      <a class="side__logo" href="#/"><img src="/media/logo-light.png" alt="{{site.name}}"></a>
      <nav class="side__nav">
        <a href="#/" data-nav-link="overview" data-perm="bookings"><svg><use href="#a-home"/></svg>Overview</a>
        <a href="#/calendar" data-nav-link="calendar" data-perm="bookings"><svg><use href="#a-cal"/></svg>Calendar</a>
        <a href="#/bookings" data-nav-link="bookings" data-perm="bookings"><svg><use href="#a-list"/></svg>Bookings<span class="badge" data-pending-badge hidden></span></a>
        <a href="#/new" data-nav-link="new" data-perm="bookings"><svg><use href="#a-plus"/></svg>New booking</a>
        <a href="/pos" target="ydpos" data-perm="pos"><svg><use href="#a-pos"/></svg>POS screen<svg class="side__ext"><use href="#a-ext"/></svg></a>
        <a href="#/bills" data-nav-link="bills" data-perm="pos"><svg><use href="#a-bill"/></svg>Bills</a>
        <a href="#/menu" data-nav-link="menu" data-perm="menu"><svg><use href="#a-list"/></svg>POS menu</a>
        <a href="#/coupons" data-nav-link="coupons" data-perm="coupons"><svg><use href="#a-tag"/></svg>Coupons</a>
        <a href="#/finance" data-nav-link="finance" data-perm="finance"><svg><use href="#a-chart"/></svg>Finance</a>
        <span class="side__sep" data-perm="site setup users">Setup</span>
        <a href="#/website" data-nav-link="website" data-perm="site"><svg><use href="#a-home"/></svg>Website</a>
        <a href="#/setup" data-nav-link="setup" data-perm="setup"><svg><use href="#a-sliders"/></svg>Booking setup</a>
        <a href="#/rooms" data-nav-link="rooms" data-perm="setup"><svg><use href="#a-bed"/></svg>Rooms</a>
        <a href="#/users" data-nav-link="users" data-perm="users"><svg><use href="#a-user"/></svg>Staff logins</a>
        <a href="#/settings" data-nav-link="settings"><svg><use href="#a-cog"/></svg>Settings</a>
      </nav>
      <div class="side__foot">
        <a href="/" target="_blank" rel="noopener"><svg><use href="#a-ext"/></svg>View website</a>
        <button type="button" data-logout><svg><use href="#a-out"/></svg>Sign out <small data-user></small></button>
      </div>
    </aside>
    <div class="side-scrim" data-side-close></div>
    <main class="main">
      <header class="top">
        <button class="top__menu" type="button" data-side-open aria-label="Open menu"><svg width="22" height="22"><use href="#a-menu"/></svg></button>
        <div>
          <h1 data-title>Overview</h1>
          <p data-subtitle></p>
        </div>
        <a class="abtn abtn--primary top__new" href="#/new" data-perm="bookings"><svg width="18" height="18"><use href="#a-plus"/></svg><span>New booking</span></a>
      </header>
      <div class="view" data-view></div>
    </main>
  </div>

  <!-- booking drawer -->
  <div class="drawer" data-drawer aria-hidden="true">
    <div class="drawer__scrim" data-drawer-close></div>
    <section class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title" data-drawer-panel></section>
  </div>

  <!-- photo library -->
  <div class="drawer drawer--center" data-library aria-hidden="true">
    <div class="drawer__scrim" data-library-close></div>
    <section class="drawer__panel library" role="dialog" aria-modal="true" aria-label="Photo library" data-library-panel></section>
  </div>

  <!-- dialogs (confirm a booking, rooms, payments…) -->
  <div class="drawer drawer--center" data-modal aria-hidden="true">
    <div class="drawer__scrim" data-modal-close></div>
    <section class="drawer__panel modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" data-modal-panel></section>
  </div>

  <div class="toasts" data-toasts aria-live="polite"></div>

  {{boot}}
  <script src="/js/pdf.js"></script>
  <script src="/js/staff.js"></script>
  <script src="/js/admin-pos.js"></script>
  <script src="/js/admin-setup.js"></script>
  <script src="/js/admin-site.js"></script>
  <script src="/js/admin-coupons.js"></script>
  <script src="/js/admin-users.js"></script>
  <script src="/js/admin-finance.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
